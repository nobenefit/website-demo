<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LOCAL — Your Code. Your People. Your Place.</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --black:#0a0a0a;--white:#f5f2ee;--cream:#e8e3db;--sand:#c9b99a;
      --rust:#b84c2b;--dark:#1a1714;--mid:#6b5f52;
      --fd:'Bebas Neue',sans-serif;--fb:'DM Sans',sans-serif;--fs:'Cormorant Garamond',serif;
    }
    html{scroll-behavior:smooth}
    body{background:var(--black);color:var(--white);font-family:var(--fb);font-weight:300;overflow-x:hidden}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-track{background:var(--black)}
    ::-webkit-scrollbar-thumb{background:var(--sand)}
    .page{display:none;min-height:100vh}
    .page.active{display:block}

    /* NAV */
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:1rem 2.5rem;background:rgba(10,10,10,0.93);backdrop-filter:blur(14px);border-bottom:1px solid rgba(201,185,154,0.12)}
    .nav-logo{font-family:var(--fd);font-size:1.9rem;letter-spacing:0.25em;color:var(--white);cursor:pointer;text-decoration:none}
    .nav-links{display:flex;gap:2.2rem;list-style:none}
    .nav-links a{font-size:0.72rem;font-weight:400;letter-spacing:0.18em;text-transform:uppercase;color:var(--sand);text-decoration:none;cursor:pointer;transition:color .3s;position:relative}
    .nav-links a::after{content:'';position:absolute;bottom:-3px;left:0;width:0;height:1px;background:var(--rust);transition:width .3s}
    .nav-links a:hover,.nav-links a.active{color:var(--white)}
    .nav-links a:hover::after,.nav-links a.active::after{width:100%}
    .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px}
    .hamburger span{display:block;width:24px;height:1.5px;background:var(--sand);transition:all .3s}
    .hamburger.open span:nth-child(1){transform:rotate(45deg) translate(4.5px,4.5px)}
    .hamburger.open span:nth-child(2){opacity:0}
    .hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(4.5px,-4.5px)}
    .mobile-menu{display:none;position:fixed;top:58px;left:0;right:0;background:rgba(10,10,10,0.97);padding:2rem;z-index:99;flex-direction:column;gap:1.5rem;border-bottom:1px solid rgba(201,185,154,0.12)}
    .mobile-menu.open{display:flex}
    .mobile-menu a{font-family:var(--fd);font-size:2rem;letter-spacing:.1em;color:var(--sand);text-decoration:none;cursor:pointer;transition:color .2s}
    .mobile-menu a:hover{color:var(--white)}

    /* BUTTONS */
    .btn-primary{background:var(--rust);color:var(--white);border:none;padding:.85rem 2.2rem;font-family:var(--fb);font-size:.75rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .3s,transform .2s}
    .btn-primary:hover{background:#9a3d22;transform:translateY(-2px)}
    .btn-outline{background:transparent;color:var(--sand);border:1px solid rgba(201,185,154,0.35);padding:.85rem 2.2rem;font-family:var(--fb);font-size:.75rem;font-weight:400;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .3s}
    .btn-outline:hover{border-color:var(--sand);color:var(--white)}

    /* SECTION HELPERS */
    .s-tag{font-size:.68rem;letter-spacing:.35em;text-transform:uppercase;color:var(--rust);margin-bottom:.8rem}
    .s-title{font-family:var(--fd);font-size:clamp(2.5rem,5vw,5rem);letter-spacing:.05em;line-height:1;color:var(--white);margin-bottom:1.2rem}
    .s-sub{font-size:.88rem;line-height:1.9;color:var(--mid);max-width:520px}

    /* ── HOME ── */
    .hero{height:100vh;display:grid;grid-template-columns:1fr 1fr;padding-top:58px;overflow:hidden}
    .hero-left{display:flex;flex-direction:column;justify-content:center;padding:4rem 3rem 4rem 5vw;z-index:2}
    .hero-tag{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--rust);margin-bottom:1.2rem}
    .hero-title{font-family:var(--fd);font-size:clamp(5rem,10vw,10rem);line-height:.88;letter-spacing:.04em;margin-bottom:.6rem}
    .hero-tagline{font-family:var(--fs);font-style:italic;font-size:clamp(1rem,2vw,1.6rem);color:var(--sand);letter-spacing:.08em;margin-bottom:1.8rem}
    .hero-sub{font-size:.88rem;line-height:1.85;color:var(--mid);max-width:360px;margin-bottom:2.5rem}
    .hero-btns{display:flex;gap:1rem;flex-wrap:wrap}
    .hero-right{position:relative;overflow:hidden}
    .hero-img-grid{display:grid;grid-template-rows:1fr 1fr;height:100%;gap:2px}
    .hero-img-block{background:var(--dark);position:relative;overflow:hidden}
    .hero-img-block img{width:100%;height:100%;object-fit:cover;opacity:.8;transition:opacity .5s,transform .6s}
    .hero-img-block:hover img{opacity:1;transform:scale(1.03)}
    .hero-lbl{position:absolute;bottom:.8rem;right:.8rem;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sand);background:rgba(10,10,10,.7);padding:.25rem .6rem}
    .scroll-hint{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.4rem;color:var(--mid);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;animation:bob 2s infinite}
    .scroll-hint::after{content:'';width:1px;height:36px;background:linear-gradient(to bottom,var(--sand),transparent)}
    @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

    .feat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(201,185,154,0.1);margin:0 5vw}
    .feat-item{background:var(--dark);padding:2.5rem 2rem;transition:background .3s}
    .feat-item:hover{background:#1f1c18}
    .feat-num{font-family:var(--fd);font-size:3.5rem;color:rgba(201,185,154,.1);line-height:1;margin-bottom:1rem}
    .feat-name{font-family:var(--fd);font-size:1.3rem;letter-spacing:.07em;color:var(--white);margin-bottom:.5rem}
    .feat-desc{font-size:.8rem;line-height:1.8;color:var(--mid)}

    .coll-preview{padding:5rem 5vw}
    .coll-hdr{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2.5rem;flex-wrap:wrap;gap:1rem}
    .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px;background:rgba(201,185,154,.06)}
    .prod-card{background:var(--dark);cursor:pointer;overflow:hidden;position:relative}
    .prod-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;transition:transform .6s,opacity .4s;opacity:.85}
    .prod-card:hover .prod-img{transform:scale(1.04);opacity:1}
    .prod-info{padding:1rem 1.2rem 1.4rem}
    .prod-cat{font-size:.62rem;letter-spacing:.25em;text-transform:uppercase;color:var(--rust);margin-bottom:.3rem}
    .prod-name{font-family:var(--fd);font-size:1.05rem;letter-spacing:.06em;color:var(--white);margin-bottom:.3rem}
    .prod-price{font-size:.82rem;color:var(--sand)}
    .prod-overlay{position:absolute;top:0;left:0;right:0;background:var(--rust);color:var(--white);text-align:center;padding:.7rem;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;transform:translateY(-100%);transition:transform .3s}
    .prod-card:hover .prod-overlay{transform:translateY(0)}
    .prod-card .add-to-cart-btn{
        position: absolute; bottom: 0; left: 0; right: 0;
        background: var(--sand); color: var(--dark); border: none; padding: .9rem;
        font-family: var(--fb); font-size: .7rem; font-weight: 500;
        letter-spacing: .2em; text-transform: uppercase; cursor: pointer;
        transform: translateY(100%); transition: transform .3s, background .3s;
        text-align: center;
    }
    .prod-card:hover .add-to-cart-btn {
        transform: translateY(0);
    }
    .prod-card .add-to-cart-btn:hover {
        background: var(--white);
    }

    .cta-band{padding:5rem 5vw;text-align:center}
    .cta-band .s-title{font-size:clamp(2rem,4vw,4rem);max-width:650px;margin:0 auto 1rem}
    .cta-band .s-sub{margin:0 auto 2rem;text-align:center}

    /* ── ABOUT ── */
    .about-hero{margin-top:58px;padding:5rem 5vw 3rem;background:var(--dark);position:relative;overflow:hidden;min-height:45vh;display:flex;align-items:flex-end}
    .about-hero h1{font-family:var(--fd);font-size:clamp(4rem,9vw,9rem);line-height:.9;letter-spacing:.04em;position:relative;z-index:2}
    .about-hero em{font-family:var(--fs);font-style:italic;font-size:clamp(1rem,2vw,1.6rem);color:var(--sand);display:block;margin-top:.5rem;position:relative;z-index:2}
    .about-logo-bg{position:absolute;right:5vw;bottom:2rem;opacity:.06;font-family:var(--fd);font-size:clamp(8rem,18vw,18rem);letter-spacing:.05em;line-height:1;pointer-events:none}
    .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;padding:5rem 5vw}
    .about-img-wrap{position:relative}
    .about-img-main{width:100%;aspect-ratio:4/5;object-fit:cover;opacity:.88}
    .about-img-accent{position:absolute;width:42%;aspect-ratio:1;object-fit:cover;bottom:-1.5rem;right:-1.5rem;border:4px solid var(--black)}
    .about-content p{font-size:.88rem;line-height:1.9;color:var(--mid);margin-bottom:1.4rem}
    .about-content p strong{color:var(--sand);font-weight:400}
    .vals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:rgba(201,185,154,.07);padding:0 5vw 5rem}
    .val-card{background:var(--dark);padding:2.2rem 1.8rem}
    .val-icon{font-size:1.6rem;margin-bottom:.8rem}
    .val-title{font-family:var(--fd);font-size:1.15rem;letter-spacing:.06em;color:var(--white);margin-bottom:.5rem}
    .val-desc{font-size:.78rem;line-height:1.8;color:var(--mid)}

    /* ── PRODUCTS ── */
    .prod-hero{margin-top:58px;padding:4rem 5vw 2.5rem;background:var(--dark)}
    .prod-hero h1{font-family:var(--fd);font-size:clamp(3rem,8vw,8rem);letter-spacing:.04em;line-height:.9}
    .filter-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:2rem}
    .filter-btn{background:transparent;border:1px solid rgba(201,185,154,.22);color:var(--mid);padding:.45rem 1.1rem;font-family:var(--fb);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .25s}
    .filter-btn:hover,.filter-btn.active{background:var(--rust);border-color:var(--rust);color:var(--white)}
    .prod-main{padding:2.5rem 5vw 5rem}
    .cat-section{margin-bottom:3.5rem}
    .cat-label{font-family:var(--fd);font-size:1.6rem;letter-spacing:.1em;color:rgba(201,185,154,.18);margin-bottom:1.2rem;padding-bottom:.4rem;border-bottom:1px solid rgba(201,185,154,.07)}

    /* ── GALLERY ── */
    .gal-hero{margin-top:58px;padding:4rem 5vw 2.5rem;background:var(--dark)}
    .gal-hero h1{font-family:var(--fd);font-size:clamp(3rem,8vw,8rem);letter-spacing:.04em;line-height:.9}
    .gal-main{padding:2rem 5vw 5rem}
    .masonry{columns:3;column-gap:3px}
    .masonry-item{break-inside:avoid;margin-bottom:3px;position:relative;overflow:hidden;cursor:pointer}
    .masonry-item img{width:100%;display:block;transition:transform .5s,opacity .4s;opacity:.82}
    .masonry-item:hover img{transform:scale(1.04);opacity:1}
    .masonry-overlay{position:absolute;inset:0;background:rgba(10,10,10,.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s}
    .masonry-item:hover .masonry-overlay{opacity:1}
    .m-icon{font-size:1.4rem;color:var(--white)}

    /* ── CONTACT ── */
    .con-hero{margin-top:58px;padding:4rem 5vw 2.5rem;background:var(--dark)}
    .con-hero h1{font-family:var(--fd);font-size:clamp(3rem,8vw,8rem);letter-spacing:.04em;line-height:.9}
    .con-main{display:grid;grid-template-columns:1fr 1.2fr;gap:4rem;padding:4rem 5vw 5rem;align-items:start}
    .con-info h2{font-family:var(--fd);font-size:1.8rem;letter-spacing:.06em;margin-bottom:1.2rem}
    .con-info p{font-size:.86rem;line-height:1.9;color:var(--mid);margin-bottom:1.8rem}
    .con-detail{display:flex;flex-direction:column;gap:1.3rem}
    .con-item{display:flex;gap:1rem;align-items:flex-start}
    .con-icon{font-size:1rem;margin-top:2px}
    .con-lbl{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--rust);margin-bottom:.25rem}
    .con-val{font-size:.85rem;color:var(--sand)}
    .con-form{display:flex;flex-direction:column;gap:1.1rem}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
    .fg{display:flex;flex-direction:column;gap:.35rem}
    .fg label{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sand)}
    .fg input,.fg textarea,.fg select{background:var(--dark);border:1px solid rgba(201,185,154,.18);color:var(--white);padding:.8rem .9rem;font-family:var(--fb);font-size:.86rem;outline:none;transition:border-color .3s;resize:none}
    .fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--sand)}
    .fg select option{background:var(--dark)}
    .form-ok{display:none;background:rgba(184,76,43,.12);border:1px solid var(--rust);padding:1rem 1.2rem;font-size:.84rem;color:var(--sand);margin-top:.5rem}

    /* ── CART & CHECKOUT ── */
    #cart-icon-container { position: relative; cursor: pointer; margin-left: 1.5rem; }
    #cart-icon-container svg { width: 24px; height: 24px; stroke: var(--sand); transition: stroke .3s; }
    #cart-icon-container:hover svg { stroke: var(--white); }
    #cart-count { position: absolute; top: -8px; right: -10px; background-color: var(--rust); color: white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: .6rem; font-weight: 700; line-height: 1; }
    .checkout-container { max-width: 900px; margin: 0 auto; padding: 5rem 2rem 4rem; }
    .checkout-title { font-family: var(--fd); font-size: clamp(2.5rem, 5vw, 4rem); text-align: center; margin-bottom: 3rem; }
    .cart-item { display: grid; grid-template-columns: 80px 1fr auto auto; align-items: center; gap: 1.5rem; padding: 1rem 0; border-bottom: 1px solid rgba(201,185,154,0.1); }
    .cart-item-img { width: 80px; height: 100px; object-fit: cover; }
    .cart-item-info .item-name { font-family: var(--fd); font-size: 1.1rem; letter-spacing: .05em; }
    .cart-item-info .item-price { font-size: .85rem; color: var(--mid); }
    .cart-item-qty { display: flex; align-items: center; gap: .5rem; }
    .cart-item-qty button { background: rgba(201,185,154,0.1); color: var(--sand); border: none; width: 25px; height: 25px; cursor: pointer; font-weight: bold; }
    .cart-item-qty input { width: 35px; text-align: center; background: transparent; border: 1px solid rgba(201,185,154,0.2); color: var(--white); padding: .2rem; }
    .cart-item-remove { background: transparent; border: none; color: var(--mid); font-size: 1.2rem; cursor: pointer; transition: color .2s; }
    .cart-item-remove:hover { color: var(--rust); }
    .cart-total { text-align: right; margin-top: 2rem; font-size: 1.2rem; font-weight: 400; }
    .checkout-form { margin-top: 3rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .checkout-form h3 { font-family: var(--fd); font-size: 1.8rem; letter-spacing: .05em; margin-bottom: 1rem; border-bottom: 1px solid rgba(201,185,154,0.1); padding-bottom: .5rem; }
    .payment-section { border: 1px solid rgba(201,185,154,0.1); padding: 1.5rem; margin-top: 1rem; }
    .payment-section p { color: var(--mid); font-size: .9rem; line-height: 1.7; }
    .payment-options { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
    .payment-option { display: flex; align-items: center; gap: 1rem; background: var(--dark); padding: 1rem; border: 1px solid rgba(201,185,154,0.1); }
    .payment-option input[type="radio"] { display: none; }
    .payment-option label { cursor: pointer; width: 100%; }
    #order-summary-details { background: var(--dark); padding: 1.5rem; margin-top: 2rem; display: none; }


    /* FOOTER */
    footer{background:var(--dark);border-top:1px solid rgba(201,185,154,.1);padding:3.5rem 5vw 2rem}
    .ft-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:2.5rem;margin-bottom:2.5rem}
    .ft-brand .nav-logo{font-size:2.2rem;display:block;margin-bottom:.8rem}
    .ft-brand p{font-size:.78rem;line-height:1.8;color:var(--mid)}
    .ft-col h4{font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:var(--sand);margin-bottom:1rem}
    .ft-col ul{list-style:none;display:flex;flex-direction:column;gap:.6rem}
    .ft-col ul li a{font-size:.8rem;color:var(--mid);text-decoration:none;cursor:pointer;transition:color .2s}
    .ft-col ul li a:hover{color:var(--white)}
    .ft-bottom{padding-top:1.5rem;border-top:1px solid rgba(201,185,154,.07);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
    .ft-bottom p{font-size:.72rem;color:var(--mid)}
    .social-links{display:flex;gap:1.2rem}
    .social-links a{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mid);text-decoration:none;transition:color .2s}
    .social-links a:hover{color:var(--rust)}
    .divider{height:1px;background:linear-gradient(to right,transparent,rgba(201,185,154,.18),transparent);margin:0 5vw}

    /* FADE */
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .f1{animation:fadeUp .65s ease forwards}
    .f2{animation:fadeUp .65s .12s ease forwards;opacity:0}
    .f3{animation:fadeUp .65s .24s ease forwards;opacity:0}
    .f4{animation:fadeUp .65s .36s ease forwards;opacity:0}

    /* RESPONSIVE */
    @media(max-width:900px){
      .hero{grid-template-columns:1fr}.hero-right{display:none}
      .hero-left{padding:3rem 1.5rem}
      nav{padding:1rem 1.5rem}.nav-links{display:none}.hamburger{display:flex}
      .about-grid{grid-template-columns:1fr;gap:2rem}.about-img-accent{display:none}
      .con-main{grid-template-columns:1fr}
      .ft-grid{grid-template-columns:1fr 1fr}
      .masonry{columns:2}
      .feat-strip{grid-template-columns:1fr;margin:0}
      .form-row{grid-template-columns:1fr}
      #cart-icon-container { position: absolute; right: 2rem; top: 1.2rem; }
      .cart-item { grid-template-columns: 60px 1fr auto; }
      .cart-item-qty { grid-column: 2 / 4; justify-self: start; margin-top: 0.5rem; }
      .cart-item-remove { justify-self: end; }
    }
    @media(max-width:600px){
      .masonry{columns:1}.ft-grid{grid-template-columns:1fr}
      .vals-grid,.prod-main,.gal-main,.con-main,.coll-preview,.cta-band{padding-left:1.5rem;padding-right:1.5rem}
      .prod-hero,.gal-hero,.con-hero,.about-hero{padding-left:1.5rem;padding-right:1.5rem}
      .checkout-container { padding: 4rem 1rem 2rem; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" onclick="go('home')">LOCAL</a>
  <ul class="nav-links" id="navLinks">
    <li><a onclick="go('home')" id="n-home" class="active">Home</a></li>
    <li><a onclick="go('about')" id="n-about">About Us</a></li>
    <li><a onclick="go('products')" id="n-products">Products</a></li>
    <li><a onclick="go('gallery')" id="n-gallery">Gallery</a></li>
    <li><a onclick="go('contact')" id="n-contact">Contact</a></li>
  </ul>
  <div id="cart-icon-container" onclick="go('checkout')">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
    <span id="cart-count">0</span>
  </div>
  <div class="hamburger" id="hbg" onclick="toggleMenu()"><span></span><span></span><span></span></div>
</nav>
<div class="mobile-menu" id="mob">
  <a onclick="go('home');closeMenu()">Home</a>
  <a onclick="go('about');closeMenu()">About Us</a>
  <a onclick="go('products');closeMenu()">Products</a>
  <a onclick="go('gallery');closeMenu()">Gallery</a>
  <a onclick="go('contact');closeMenu()">Contact</a>
</div>

<!-- ══ HOME ══ -->
<div class="page active" id="page-home">
  <section class="hero">
    <div class="hero-left">
      <p class="hero-tag f1">Est. 2024 — Your Code. Your People. Your Place.</p>
      <h1 class="hero-title f2">LOCAL</h1>
      <p class="hero-tagline f2">Wear your roots.</p>
      <p class="hero-sub f3">Tracksuits built for real people, real streets, and real places. From Kimberley to Cape Town — LOCAL is your code.</p>
      <div class="hero-btns f4">
        <button class="btn-primary" onclick="go('products')">Shop Now</button>
        <button class="btn-outline" onclick="go('about')">Our Story</button>
      </div>
